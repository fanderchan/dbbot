---
- name: Validate ClickHouse complex password XML rendering
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    render_dir: "{{ lookup('env', 'DBBOT_CLICKHOUSE_PASSWORD_TEST_DIR') }}"
    clickhouse_default_password: "Aa1$&<>\"']]>"
    clickhouse_automation_client_user: default
    clickhouse_automation_client_password: "{{ clickhouse_default_password }}"
    fcs_clickhouse_fast_login_host: 127.0.0.1
    clickhouse_tcp_port_base: 9000
    max_memory_usage: 1073741824
    max_bytes_before_external_group_by: 536870912
    background_pool_size: 16
    clickhouse_default_user_allowed_networks_effective:
      - 127.0.0.1
      - ::1
    clickhouse_topology_mode: standalone
    clickhouse_all_nodes:
      - name: ck-test
        ip: 127.0.0.1
        shard: 1
        replica: 1
        instance_id: 1
        replica_name: ck-test
    ck_physical_host: 127.0.0.1
    clickhouse_cluster_name: test_cluster
    current_node_shard: 1
    current_node_replica_name: ck-test

  tasks:
    - name: Validate password rendering output directory
      ansible.builtin.assert:
        that:
          - render_dir | length > 0
        fail_msg: "DBBOT_CLICKHOUSE_PASSWORD_TEST_DIR must be set."

    - name: Render users configuration with a complex password
      ansible.builtin.template:
        src: ../roles/deploy_clickhouse/templates/users.xml.j2
        dest: "{{ render_dir }}/users.xml"
        mode: '0600'
      no_log: true

    - name: Render cluster configuration with a complex password
      ansible.builtin.template:
        src: ../roles/deploy_clickhouse/templates/cluster.xml.j2
        dest: "{{ render_dir }}/cluster.xml"
        mode: '0600'
      no_log: true

    - name: Render automation client configuration with a complex password
      ansible.builtin.template:
        src: ../roles/deploy_clickhouse/templates/clickhouse-client-automation.xml.j2
        dest: "{{ render_dir }}/automation-client.xml"
        mode: '0600'
      no_log: true

    - name: Render fast-login client configuration with a complex password
      ansible.builtin.template:
        src: ../roles/deploy_clickhouse/templates/clickhouse-client-fast-login.xml.j2
        dest: "{{ render_dir }}/fast-login-client.xml"
        mode: '0600'
      no_log: true
