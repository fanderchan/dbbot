# LAB/TEST ONLY: setup_nfs_server.yml does not provide a production NFS
# security or backup immutability policy. Production NFS is externally managed.
# The public example uses an RFC 5737 documentation-only address.

[clickhouse_nfs_server]
nfs-example ansible_host=192.0.2.20

[all:vars]
dbbot_inventory_purpose=nfs_server
ansible_python_interpreter=auto_silent
ansible_user=root
ansible_ssh_pass="'<your_ssh_password>'"
