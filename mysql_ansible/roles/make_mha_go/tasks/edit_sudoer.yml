# Grant only the exact root commands required by the generated VIP hook.

- name: Install MHA-Go VIP command packages
  ansible.builtin.package:
    name:
      - iproute
      - iputils
    state: present

- name: Install MHA-Go VIP sudo policy
  ansible.builtin.template:
    src: ../templates/mha_go_vip_sudoers.j2
    dest: /etc/sudoers.d/dbbot-mha-go-vip
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Remove legacy dbbot-generated MHA-Go sudoers block
  ansible.builtin.replace:
    path: /etc/sudoers
    regexp: '(?m)^# added by dbbot make_mha_go[ \t]*\r?\n[ \t]*[^# \t\r\n][^ \t\r\n]*[ \t]+ALL[ \t]*=[ \t]*\(ALL\)[ \t]+NOPASSWD:[ \t]*/usr/sbin/ip[ \t]*,[ \t]*/sbin/arping[ \t]*(?:\r?\n)?'
    replace: ''
    validate: /usr/sbin/visudo -cf %s

- name: Validate complete sudoers configuration
  ansible.builtin.command: /usr/sbin/visudo -c
  changed_when: false

- name: Verify required MHA-Go VIP commands are allowed
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/sudo', '-n', '-l', '-U', mysql_user, '--'] + item }}"
  loop:
    - - /usr/sbin/ip
      - addr
      - add
      - "{{ vip }}/{{ vip_netmask }}"
      - dev
      - "{{ net_work_interface }}"
    - - /usr/sbin/ip
      - addr
      - del
      - "{{ vip }}/{{ vip_netmask }}"
      - dev
      - "{{ net_work_interface }}"
    - - /sbin/arping
      - -c
      - '3'
      - -U
      - -I
      - "{{ net_work_interface }}"
      - "{{ vip }}"
  loop_control:
    label: "{{ item | join(' ') }}"
  changed_when: false

- name: Verify unsafe MHA-Go sudo commands are denied
  ansible.builtin.command:
    argv:
      - /usr/bin/sudo
      - -n
      - -l
      - -U
      - "{{ mysql_user }}"
      - --
      - /usr/sbin/ip
      - netns
      - exec
      - dbbot-mha-go-sudo-policy-check
      - /usr/bin/id
  register: make_mha_go__unsafe_sudo_check
  changed_when: false
  failed_when: make_mha_go__unsafe_sudo_check.rc != 1
